spring.application.name=bank-account-service
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
# also start/use the Docker Compose database when running @SpringBootTest tests
spring.docker.compose.skip.in-tests=false
# bootRun and tests only need the database from compose.yaml, not the app container
spring.docker.compose.start.arguments=db
spring.docker.compose.stop.arguments=db
# success:
external-logging.url=https://tools-httpstatus.pickup-services.com/200
# failure:
#external-logging.url=https://tools-httpstatus.pickup-services.com/500
# slow:
#external-logging.url=https://tools-httpstatus.pickup-services.com/200?sleep=5000